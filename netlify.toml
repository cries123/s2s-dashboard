[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin", "canvas"]

[functions.api]
  timeout = 300

# Wakes every five minutes; pulls at 6:00 AM and 4:45 PM Pacific, a few stages
# per wake-up (server/pbs/pbsSyncSchedule.ts, netlify/functions/pbs-daily-sync.ts).
[functions."pbs-daily-sync"]
  schedule = "*/5 * * * *"
  timeout = 300

# API routes must be proxied to the serverless function BEFORE the SPA fallback.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
